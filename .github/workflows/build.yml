name: Build Windows exe

# Builds WiktionaryLookup.exe on a real Windows runner and attaches it as a
# downloadable artifact. Push this repo to GitHub, then run this workflow
# manually from the "Actions" tab (or it runs automatically on every push).

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --noconsole --onefile --name WiktionaryLookup main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiktionaryLookup-windows-exe
          path: dist/WiktionaryLookup.exe
